        };

        const BEER_FLAVORS = [
            {

                colorClass: 'amber',
                bgTheme: 'bg-amber-50',
                borderTheme: 'border-amber-400',
                accentColor: '#D97706',
                hoverAccent: 'hover:bg-amber-600',

        const quizQuestions = [
            {
                question: "Qual o seu momento perfeito para apreciar uma cerveja?",
                options: [
                    { text: "Um pôr do sol relaxante no campo ou na praia", points: { mel: 2, limao: 1 } },
                    { text: "Lendo um bom livro ou em uma cafeteria sofisticada", points: { cafe: 2, matcha: 1 } },
                    { text: "Após uma sessão revigorante de yoga ou meditação", points: { matcha: 2, limao: 1 } },
                    { text: "Uma festa badalada ou jantar romântico à luz de velas", points: { 'frutas-vermelhas': 2, cafe: 1 } },
                ]
            },
            {
                question: "Que tipo de sabor mais agrada o seu paladar?",
                options: [
                    { text: "Doce e encorpado com aromas florais e naturais", points: { mel: 2, 'frutas-vermelhas': 1 } },

                ]
            },
            {
                question: "Escolha uma sobremesa dos deuses:",
                options: [
                    { text: "Petit Gâteau de chocolate belga ou Tiramisù", points: { cafe: 2 } },
                    { text: "Torta de Limão Siciliano ou Sorvete de Tangerina", points: { limao: 2, matcha: 1 } },
                    { text: "Crème Brûlée com calda de morango silvestre", points: { 'frutas-vermelhas': 2, mel: 1 } },
                    { text: "Mochi japonês de chá verde ou salada de frutas", points: { matcha: 2, mel: 1 } },
                ]
            }
        ];

        function App() {
            const [showAgeModal, setShowAgeModal] = useState(true);
            const [selectedFlavor, setSelectedFlavor] = useState(BEER_FLAVORS[0]);
            const [cart, setCart] = useState([]);
            const [isCartOpen, setIsCartOpen] = useState(false);
            const [favorites, setFavorites] = useState([]);
            const [coupon, setCoupon] = useState('');
            const [discount, setDiscount] = useState(0);
            const [couponError, setCouponError] = useState('');
            const [couponApplied, setCouponApplied] = useState(false);

            // Quiz States
            const [quizStep, setQuizStep] = useState(0); // 0: não iniciado, 1, 2, 3: perguntas, 4: resultado
            const [quizAnswers, setQuizAnswers] = useState([]);
            const [quizResult, setQuizResult] = useState(null);

            // Checkout State
            const [checkoutStep, setCheckoutStep] = useState('idle'); // idle, open, processing, success
            const [shippingAddress, setShippingAddress] = useState({
                nome: '', cep: '', rua: '', numero: '', telefone: ''
            });

            useEffect(() => {
                const verified = localStorage.getItem('beer_bear_age_verified');
                if (verified === 'true') {
                    setShowAgeModal(false);
                }
            }, []);

            const handleAgeVerify = (isMajor) => {
                if (isMajor) {
                    setShowAgeModal(false);
                    localStorage.setItem('beer_bear_age_verified', 'true');
                } else {
                    window.location.href = "https://www.google.com";
                }
            };

            const addToCart = (beer, type, price) => {
                const itemId = `${beer.id}-${type}`;
                const existingItem = cart.find(item => item.id === itemId);

                if (existingItem) {
                    setCart(cart.map(item => 
                        item.id === itemId ? { ...item, quantity: item.quantity + 1 } : item
                    ));
                } else {
                    setCart([...cart, {
                        id: itemId,
                        beerId: beer.id,
                        name: `Beer Bear ${beer.name}`,
                        bearType: beer.bearType,
                        type: type === 'bottle' ? 'Garrafa Colecionável (500ml)' : 'Lata Especial (473ml)',
                        price: price,
                        quantity: 1
                    }]);
                }
                setIsCartOpen(true);
            };

            const updateQuantity = (itemId, delta) => {
                setCart(cart.map(item => {
                    if (item.id === itemId) {
                        const newQty = item.quantity + delta;
                        return newQty > 0 ? { ...item, quantity: newQty } : item;
                    }
                    return item;
                }).filter(item => item.quantity > 0));
            };

            const toggleFavorite = (beerId) => {
                if (favorites.includes(beerId)) {
                    setFavorites(favorites.filter(id => id !== beerId));
                } else {
                    setFavorites([...favorites, beerId]);
                }
            };

            const applyCoupon = () => {
                if (coupon.toUpperCase() === 'BEAR10') {
                    setDiscount(0.10);
                    setCouponApplied(true);
                    setCouponError('');
                } else if (coupon.toUpperCase() === 'BEARKIT') {
                    setDiscount(0.15);
                    setCouponApplied(true);
                    setCouponError('');
                } else {
                    setCouponError('Cupom inválido. Tente "BEAR10"');
                }
            };

            const handleQuizAnswer = (points) => {
                const updatedAnswers = [...quizAnswers, points];
                setQuizAnswers(updatedAnswers);

                if (quizStep < quizQuestions.length) {
                    setQuizStep(quizStep + 1);
                }

                if (quizStep === quizQuestions.length) {
                    const score = { mel: 0, cafe: 0, matcha: 0, limao: 0, 'frutas-vermelhas': 0 };
                    updatedAnswers.forEach(answer => {
                        Object.keys(answer).forEach(key => {
                            score[key] = (score[key] || 0) + answer[key];
                        });
                    });

                    let winningFlavor = BEER_FLAVORS[0];
                    let maxScore = -1;
                    Object.keys(score).forEach(key => {
                        if (score[key] > maxScore) {
                            maxScore = score[key];
                            winningFlavor = BEER_FLAVORS.find(f => f.id === key);
                        }
                    });

                    setQuizResult(winningFlavor);
                    setQuizStep(4);
                }
            };

            const cartSubtotal = cart.reduce((acc, item) => acc + (item.price * item.quantity), 0);
            const discountAmount = cartSubtotal * discount;
            const shippingCost = cartSubtotal > 150 ? 0 : (cartSubtotal > 0 ? 15.00 : 0);
            const cartTotal = cartSubtotal - discountAmount + shippingCost;

            const handleCheckoutSubmit = (e) => {
                e.preventDefault();
                setCheckoutStep('processing');
                setTimeout(() => {
                    setCheckoutStep('success');
                    setCart([]);
                }, 2000);
            };

            return (

                    {/* Age verification modal */}
                    {showAgeModal && (
                        <div className="fixed inset-0 bg-stone-950/95 z-50 flex items-center justify-center p-4 backdrop-blur-md">
                            <div className="bg-[#2a1b12] text-[#fbf6f0] max-w-md w-full rounded-2xl p-8 border border-amber-600/30 text-center shadow-2xl relative overflow-hidden">
                                <div className="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-amber-500 via-yellow-400 to-red-500"></div>
                                <div className="mb-6 inline-flex p-4 bg-amber-500/10 rounded-full border border-amber-500/30">
                                    <Icons.Beer />
                                </div>
                                <h2 className="text-3xl font-serif font-extrabold tracking-wide text-amber-400 mb-2">BEER BEAR</h2>
                                <p className="text-stone-300 font-serif italic text-sm mb-6">CERVEJARIA GOURMET • EST. 2026</p>
                                <h3 className="text-xl font-bold mb-4 text-stone-100">Você é maior de 18 anos?</h3>
                                <p className="text-stone-400 text-sm mb-8">O consumo e compra de bebidas alcoólicas são proibidos para menores de 18 anos.</p>
                                <div className="grid grid-cols-2 gap-4">
                                    <button onClick={() => handleAgeVerify(false)} className="py-3 px-4 border border-stone-600 rounded-xl font-semibold hover:bg-stone-800 text-stone-300 transition-colors">Não</button>
                                    <button onClick={() => handleAgeVerify(true)} className="py-3 px-4 bg-amber-500 text-stone-950 font-bold rounded-xl hover:bg-amber-400 transition-colors shadow-lg">Sim, tenho 18+</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Top Announcement Bar */}
                    <div className="bg-[#22150e] text-[#fbf6f0] text-xs py-2 px-4 text-center font-medium tracking-wider flex items-center justify-center gap-2">
                        <Icons.Sparkles />
                        <span>FRETE GRÁTIS ACIMA DE R$ 150! USE O CUPOM <strong className="text-amber-400">BEAR10</strong> PARA 10% OFF</span>
                        <Icons.Sparkles />
                    </div>

                    {/* Navigation */}
                    <nav className="sticky top-0 bg-[#2d1e15]/95 backdrop-blur-md text-[#fbf6f0] z-30 shadow-lg border-b border-amber-900/20">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="bg-amber-500 text-stone-950 p-2.5 rounded-xl font-black text-xl shadow-md">BB</div>
                                <div>
                                    <span className="font-serif text-2xl font-black tracking-wider text-amber-400 block leading-tight">BEER BEAR</span>
                                    <span className="text-[10px] tracking-widest text-stone-300 block uppercase">Cervejaria Gourmet</span>
                                </div>
                            </div>
                            <div className="hidden md:flex items-center gap-8 font-medium">
                                <a href="#sabores" className="hover:text-amber-400 transition-colors text-stone-200">Nossos Sabores</a>
                                <a href="#quiz" className="hover:text-amber-400 transition-colors text-stone-200">Descubra seu Sabor</a>
                                <a href="#colecao" className="hover:text-amber-400 transition-colors text-stone-200">A Coleção</a>
                            </div>
                            <button onClick={() => setIsCartOpen(true)} className="relative bg-amber-500 text-stone-950 p-3 rounded-full hover:bg-amber-400 transition-all flex items-center shadow-md">
                                <Icons.ShoppingCart />
                                {cart.length > 0 && (
                                    <span className="absolute -top-1.5 -right-1.5 bg-red-600 text-white text-xs font-bold rounded-full w-5 h-5 flex items-center justify-center animate-bounce">
                                        {cart.reduce((sum, item) => sum + item.quantity, 0)}
                                    </span>
                                )}
                            </button>
                        </div>
                    </nav>

                    {/* Hero Section */}
                    <header className="relative bg-[#1e1008] text-white overflow-hidden py-20 lg:py-32">
                        <div className="absolute inset-0 z-0">
                            <img src="https://images.unsplash.com/photo-1538481199705-c710c4e965fc?auto=format&fit=crop&w=1200&q=80" alt="Bar Background" className="w-full h-full object-cover opacity-25" />
                            <div className="absolute inset-0 bg-gradient-to-t from-[#1e1008] via-transparent to-[#1e1008]/80"></div>
                        </div>
                        <div className="relative z-10 max-w-7xl mx-auto px-4 grid grid-cols-1 lg:grid-cols-12 gap-12 items-center">
                            <div className="lg:col-span-7 space-y-6">
                                <div className="inline-flex items-center gap-2 bg-amber-500/20 border border-amber-500/40 text-amber-300 px-3 py-1.5 rounded-full text-xs font-bold uppercase tracking-wider">
                                    <Icons.Award /> Alta Gastronomia Selvagem
                                </div>
                                <h1 className="text-4xl sm:text-5xl lg:text-6xl font-serif font-black leading-tight">
                                    Para a sua <br/><span className="text-amber-400">sede de urso.</span>
                                </h1>
                                <p className="text-lg text-stone-300 max-w-xl">
                                    Cinco ursos lendários, cinco receitas sofisticadas e artesanais exclusivas. Uma verdadeira experiência gourmet engarrafada de forma única.
                               </p>
                                <div className="flex flex-col sm:flex-row gap-4 pt-2">
                                    <a href="#sabores" className="inline-flex items-center justify-center gap-2 bg-amber-500 text-stone-950 font-extrabold px-8 py-4 rounded-xl hover:bg-amber-400 transition-all shadow-xl">
                                        Explorar Coleção <Icons.ArrowRight />
                                    </a>
                                    <a href="#quiz" className="inline-flex items-center justify-center gap-2 bg-stone-800/90 border border-stone-700 text-white font-bold px-8 py-4 rounded-xl hover:bg-stone-700 transition-all">
                                        Fazer o Quiz do Sabor <Icons.Flame />
                                    </a>
                                </div>
                            </div>
                            <div id="colecao" className="lg:col-span-5 flex justify-center">
                                <div className="bg-[#2d1b11]/90 border border-amber-500/20 rounded-2xl p-6 shadow-2xl max-w-sm w-full text-center">
                                    <span className="bg-amber-500 text-stone-950 font-black text-xs px-2.5 py-1 rounded-full uppercase">Linha 2026</span>
                                    <h3 className="font-serif text-xl font-bold text-amber-400 mt-3 mb-2">Edição de Colecionador</h3>
                                    <img src="https://images.unsplash.com/photo-1567696911980-2eed69a46042?auto=format&fit=crop&w=400&q=80" alt="Beer Bottles Collection" className="w-full h-48 object-cover rounded-xl my-4 border border-amber-500/10" />
                                    <p className="text-stone-300 text-xs">Frascos esculpidos correspondentes à personalidade de cada urso.</p>
                                </div>
                            </div>
                        </div>
                    </header>

                    {/* Interactive Flavors Section */}
                    <section id="sabores" className="py-20 bg-[#fbf6f0] scroll-mt-20 flex-1">
                        <div className="max-w-7xl mx-auto px-4">
                            <div className="text-center max-w-2xl mx-auto mb-12">
                                <h2 className="text-sm font-bold text-amber-600 tracking-widest uppercase">Linha Premium Exclusiva</h2>
                                <p className="text-3xl sm:text-4xl font-serif font-black text-stone-900 mt-1">Encontre sua Cerveja de Urso</p>
                            </div>

                            {/* Selectors */}
                            <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-3 max-w-4xl mx-auto mb-12">
                                {BEER_FLAVORS.map((beer) => {
                                    const isSelected = selectedFlavor.id === beer.id;
                                    const IconComponent = beer.icon;
                                    return (
                                        <button key={beer.id} onClick={() => setSelectedFlavor(beer)} className={`flex flex-col items-center justify-center p-4 rounded-xl border-2 transition-all text-center relative ${isSelected ? `${beer.bgTheme} ${beer.borderTheme} shadow-md scale-105` : 'bg-white border-stone-200 hover:bg-stone-50'}`}>
                                            <div className="w-10 h-10 rounded-full flex items-center justify-center mb-2" style={{ backgroundColor: `${beer.accentColor}20`, color: beer.accentColor }}>
                                                <IconComponent />
                                            </div>
                                            <span className="font-bold text-[10px] text-stone-400 uppercase tracking-wider">{beer.bearType}</span>
                                            <span className="font-serif font-bold text-sm text-stone-900 block mt-0.5">{beer.name}</span>
                                            {isSelected && (
                                                <div className="absolute -top-1.5 -right-1.5 w-5 h-5 bg-stone-900 rounded-full flex items-center justify-center text-amber-400">
                                                    <Icons.Check />
                                                </div>
                                            )}
                                        </button>
                                    );
                                })}
                            </div>

                            {/* Flavor Details Card */}
                            <div className={`rounded-3xl border-2 shadow-xl overflow-hidden max-w-5xl mx-auto transition-all duration-300 ${selectedFlavor.bgTheme} ${selectedFlavor.borderTheme}`}>
                                <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 p-6 sm:p-10 lg:p-12 items-center">
                                    <div className="lg:col-span-5">
                                        <div className="bg-white/80 p-4 rounded-2xl border border-stone-200 shadow-inner flex flex-col items-center">
                                            <span className={`inline-block px-3 py-1 rounded-full text-xs font-bold uppercase mb-4 ${selectedFlavor.badgeBg} ${selectedFlavor.textAccent}`}>
                                                {selectedFlavor.bearType} • {selectedFlavor.character}
                                            </span>
                                            <img src={selectedFlavor.imageUrl} alt={selectedFlavor.name} className="w-full aspect-square object-cover rounded-xl shadow-md border border-stone-100" />
                                        </div>
                                    </div>
                                    <div className="lg:col-span-7 space-y-6">
                                        <div>
                                            <div className="flex items-center gap-1 text-amber-500 mb-1">
                                                <Icons.Star /><Icons.Star /><Icons.Star /><Icons.Star /><Icons.Star />
                                                <span className="text-xs text-stone-500 font-bold ml-2">(142 avaliações)</span>
                                            </div>
                                            <h3 className="text-3xl font-serif font-black text-stone-900">Beer Bear {selectedFlavor.name}</h3>
                                            <p className="text-sm font-semibold text-stone-500 italic mt-0.5">Estilo Gourmet Selecionado</p>
                                        </div>
                                        <p className="text-stone-700 leading-relaxed">{selectedFlavor.description}</p>
                                        
                                        {/* Specs */}
                                        <div className="grid grid-cols-2 sm:grid-cols-4 gap-4 py-4 border-y border-stone-300/50 text-center">
                                            <div className="bg-white/60 p-2 rounded-lg border border-stone-100"><span className="block text-[10px] text-stone-400 uppercase font-bold">Teor (ABV)</span><span className="font-serif font-bold text-stone-800 text-base">{selectedFlavor.abv}</span></div>
                                            <div className="bg-white/60 p-2 rounded-lg border border-stone-100"><span className="block text-[10px] text-stone-400 uppercase font-bold">Amargor (IBU)</span><span className="font-serif font-bold text-stone-800 text-base">{selectedFlavor.ibu}</span></div>
                                            <div className="bg-white/60 p-2 rounded-lg border border-stone-100"><span className="block text-[10px] text-stone-400 uppercase font-bold">Temperatura</span><span className="font-serif font-bold text-stone-800 text-base">{selectedFlavor.temp}</span></div>
                                            <div className="bg-white/60 p-2 rounded-lg border border-stone-100 flex flex-col justify-center items-center">
                                                <span className="block text-[10px] text-stone-400 uppercase font-bold mb-0.5">Favorito</span>
                                                <button onClick={() => toggleFavorite(selectedFlavor.id)} className="focus:outline-none">
                                                    <Icons.Heart filled={favorites.includes(selectedFlavor.id)} />
                                                </button>
                                            </div>
                                        </div>

                                        <p className="text-xs text-stone-600"><strong>Harmonização:</strong> {selectedFlavor.harmonization}</p>

                                        {/* Pack Options */}
                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-2">
                                            <div className="bg-white/90 p-4 rounded-xl border border-stone-200 flex flex-col justify-between">
                                                <div>
                                                    <span className="bg-amber-100 text-amber-900 text-[10px] font-bold px-2 py-0.5 rounded uppercase">Garrafa Premium</span>
                                                    <div className="flex justify-between items-end mt-4 mb-2">
                                                        <span className="text-xs text-stone-400">Frasco 500ml</span>
                                                        <span className="text-xl font-serif font-extrabold text-stone-900">R$ {selectedFlavor.priceBottle.toFixed(2)}</span>
                                                    </div>
                                                </div>
                                                <button onClick={() => addToCart(selectedFlavor, 'bottle', selectedFlavor.priceBottle)} className="w-full py-2.5 rounded-lg text-white font-bold text-sm flex items-center justify-center gap-2 shadow-md transition-all hover:opacity-90" style={{ backgroundColor: selectedFlavor.accentColor }}>
                                                    <Icons.ShoppingCart /> Comprar Garrafa
                                                </button>
                                            </div>
                                            <div className="bg-white/90 p-4 rounded-xl border border-stone-200 flex flex-col justify-between">
                                                <div>
                                                    <span className="bg-stone-200 text-stone-800 text-[10px] font-bold px-2 py-0.5 rounded uppercase">Lata Especial</span>
                                                    <div className="flex justify-between items-end mt-4 mb-2">
                                                        <span className="text-xs text-stone-400">Volume 473ml</span>
                                                        <span className="text-xl font-serif font-extrabold text-stone-900">R$ {selectedFlavor.priceCan.toFixed(2)}</span>
                                                    </div>
                                                </div>
                                                <button onClick={() => addToCart(selectedFlavor, 'can', selectedFlavor.priceCan)} className="w-full py-2.5 rounded-lg text-white font-bold text-sm flex items-center justify-center gap-2 shadow-md transition-all hover:opacity-90" style={{ backgroundColor: selectedFlavor.accentColor }}>
                                                    <Icons.ShoppingCart /> Comprar Lata
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* Personality Quiz Section */}
                    <section id="quiz" className="py-20 bg-stone-900 text-white scroll-mt-20">
                        <div className="max-w-3xl mx-auto px-4 text-center">
                            <div className="inline-flex p-3 bg-amber-500/10 rounded-full border border-amber-500/30 text-amber-400 mb-4">
                                <Icons.Flame />
                            </div>
                            <h2 className="text-3xl font-serif font-black mb-4">Qual Urso Clama pelo seu Paladar?</h2>
                            <p className="text-stone-400 text-sm max-w-md mx-auto mb-8">Responda a 3 perguntas rápidas criadas pelos nossos mestres cervejeiros e descubra sua combinação ideal.</p>

                            <div className="bg-stone-800/90 rounded-2xl p-6 sm:p-10 border border-stone-700 shadow-xl text-left max-w-xl mx-auto">
                                {quizStep === 0 && (
                                    <div className="text-center py-6">
                                        <p className="text-stone-300 mb-6">Pronto para iniciar a jornada sensorial?</p>
                                        <button onClick={() => setQuizStep(1)} className="bg-amber-500 text-stone-950 font-bold px-8 py-3 rounded-xl hover:bg-amber-400 transition-all">Iniciar Quiz do Sabor</button>
                                    </div>
                                )}
                                {quizStep > 0 && quizStep <= quizQuestions.length && (
                                    <div>
                                        <div className="flex justify-between items-center mb-4 text-xs font-bold uppercase tracking-wider text-amber-500">
                                            <span>Pergunta {quizStep} de {quizQuestions.length}</span>
                                            <span className="w-16 h-1.5 bg-stone-700 rounded-full overflow-hidden"><span className="block h-full bg-amber-500 transition-all" style={{ width: `${(quizStep/quizQuestions.length)*100}%` }}></span></span>
                                        </div>
                                        <h4 className="text-lg font-bold mb-6 text-stone-100">{quizQuestions[quizStep-1].question}</h4>
                                        <div className="space-y-3">
                                            {quizQuestions[quizStep-1].options.map((option, idx) => (
                                                <button key={idx} onClick={() => handleQuizAnswer(option.points)} className="w-full text-left p-4 rounded-xl bg-stone-700/50 border border-stone-600 text-stone-200 font-medium hover:bg-stone-600/70 hover:border-amber-500/50 transition-all text-sm">
                                                    {option.text}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                )}
                                {quizStep === 4 && quizResult && (
                                    <div className="text-center py-4">
                                        <span className="text-xs font-bold text-amber-500 uppercase tracking-widest">Seu Resultado Perfeito</span>
                                        <h4 className="text-2xl font-serif font-black text-white mt-1 mb-3">Urso Recomendado: {quizResult.bearType}</h4>
                                        <div className="bg-stone-900/50 p-4 rounded-xl border border-stone-700 max-w-xs mx-auto mb-6">
                                            <img src={quizResult.imageUrl} alt={quizResult.name} className="w-24 h-24 object-cover rounded-lg mx-auto mb-2" />
                                            <span className="font-bold text-amber-400 block">{quizResult.name}</span>
                                            <p className="text-xs text-stone-400 line-clamp-2 mt-1">{quizResult.description}</p>
                                        </div>
                                        <div className="flex flex-col sm:flex-row gap-3 justify-center">
                                            <button onClick={() => { setSelectedFlavor(quizResult); document.getElementById('sabores').scrollIntoView(); }} className="bg-stone-700 text-white font-bold px-5 py-2.5 rounded-lg text-sm hover:bg-stone-600">Ver Detalhes</button>
                                            <button onClick={() => { setQuizStep(0); setQuizAnswers([]); }} className="text-stone-400 hover:text-white text-xs font-semibold py-2">Refazer Quiz</button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    </section>

                    {/* Shopping Cart Drawer */}
                    {isCartOpen && (
                        <div className="fixed inset-0 z-50 flex justify-end">
                            <div className="absolute inset-0 bg-stone-950/60 backdrop-blur-xs" onClick={() => setIsCartOpen(false)}></div>
                            <div className="relative w-full max-w-md bg-white h-full shadow-2xl flex flex-col z-10">
                                <div className="p-6 flex items-center justify-between border-b border-stone-200">
                                    <h2 className="text-xl font-bold flex items-center gap-2 text-stone-900"><Icons.ShoppingCart /> Seu Carrinho</h2>
                                    <button onClick={() => setIsCartOpen(false)} className="text-stone-400 hover:text-stone-600"><Icons.X /></button>
                                </div>
                                <div className="flex-1 overflow-y-auto p-6 custom-scrollbar">
                                    {cart.length === 0 ? (
                                        <div className="text-center py-20 text-stone-400">
                                            <p className="font-medium">Seu carrinho está vazio.</p>
                                            <button onClick={() => setIsCartOpen(false)} className="text-amber-600 font-bold text-sm mt-2 underline">Explorar Sabores</button>
                                        </div>
                                    ) : (
                                        cart.map(item => (
                                            <div key={item.id} className="flex justify-between items-center mb-4 pb-4 border-b border-stone-100">
                                                <div className="space-y-0.5">
                                                    <h4 className="font-bold text-stone-900 text-sm">{item.name}</h4>
                                                    <p className="text-xs text-stone-400">{item.type}</p>
                                                    <p className="font-bold text-amber-700 text-sm">R$ {item.price.toFixed(2)}</p>
                                                </div>
                                                <div className="flex items-center gap-2 bg-stone-100 p-1 rounded-lg">
                                                    <button onClick={() => updateQuantity(item.id, -1)} className="p-1 hover:bg-white rounded text-stone-600"><Icons.Minus /></button>
                                                    <span className="w-6 text-center font-bold text-stone-800 text-xs">{item.quantity}</span>
                                                    <button onClick={() => updateQuantity(item.id, 1)} className="p-1 hover:bg-white rounded text-stone-600"><Icons.Plus /></button>
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>
                                {cart.length > 0 && (
                                    <div className="p-6 border-t bg-stone-50 space-y-4">
                                        {/* Coupons */}
                                        {!couponApplied ? (
                                            <div className="flex gap-2">
                                                <input type="text" placeholder="Cupom (Ex: BEAR10)" value={coupon} onChange={(e) => setCoupon(e.target.value)} className="flex-1 px-3 py-2 border rounded-xl text-sm uppercase font-semibold" />
                                                <button onClick={applyCoupon} className="bg-stone-900 text-white px-4 py-2 rounded-xl text-sm font-bold hover:bg-stone-800">Aplicar</button>
                                            </div>
                                        ) : (
                                            <div className="bg-emerald-50 text-emerald-800 p-2.5 rounded-xl text-xs font-semibold flex justify-between items-center">
                                                <span>Desconto do Cupom Aplicado!</span>
                                                <button onClick={() => { setDiscount(0); setCouponApplied(false); }} className="underline font-bold">Remover</button>
                                            </div>
                                        )}
                                        {couponError && <p className="text-red-600 text-xs font-medium px-1">{couponError}</p>}

                                        {/* Finance summary */}
                                        <div className="space-y-1.5 text-sm border-t border-stone-200/60 pt-3">
                                            <div className="flex justify-between text-stone-500"><span>Subtotal:</span><span>R$ {cartSubtotal.toFixed(2)}</span></div>
                                            {discount > 0 && <div className="flex justify-between text-emerald-600"><span>Desconto:</span><span>- R$ {discountAmount.toFixed(2)}</span></div>}
                                            <div className="flex justify-between text-stone-500"><span>Frete:</span><span>{shippingCost === 0 ? <strong className="text-emerald-600">GRÁTIS</strong> : `R$ ${shippingCost.toFixed(2)}`}</span></div>
                                            <div className="flex justify-between text-stone-900 font-black text-lg pt-1"><span>Total:</span><span>R$ {cartTotal.toFixed(2)}</span></div>
                                        </div>

                                        <button onClick={() => setCheckoutStep('open')} className="w-full bg-amber-500 hover:bg-amber-400 text-stone-950 font-black py-4 rounded-xl transition-all shadow-md shadow-amber-500/10 text-center">
                                            Finalizar Compra
                                        </button>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* Checkout Modal Form */}
                    {checkoutStep !== 'idle' && (
                        <div className="fixed inset-0 bg-stone-950/80 z-50 flex items-center justify-center p-4 backdrop-blur-xs">
                            <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl relative border border-stone-100">
                                <button onClick={() => setCheckoutStep('idle')} className="absolute top-4 right-4 text-stone-400 hover:text-stone-600"><Icons.X /></button>
                                
                                {checkoutStep === 'open' && (
                                    <form onSubmit={handleCheckoutSubmit} className="space-y-4">
                                        <h3 className="text-lg font-bold text-stone-900 border-b pb-2">Informações de Entrega (Simulação)</h3>
                                        <div><label className="block text-xs font-bold text-stone-500 uppercase mb-1">Nome Completo</label><input type="text" required value={shippingAddress.nome} onChange={(e) => setShippingAddress({...shippingAddress, nome: e.target.value})} className="w-full border rounded-xl px-3 py-2 text-sm" /></div>
                                        <div className="grid grid-cols-2 gap-3">
                                            <div><label className="block text-xs font-bold text-stone-500 uppercase mb-1">CEP</label><input type="text" required placeholder="00000-00" value={shippingAddress.cep} onChange={(e) => setShippingAddress({...shippingAddress, cep: e.target.value})} className="w-full border rounded-xl px-3 py-2 text-sm" /></div>
                                            <div><label className="block text-xs font-bold text-stone-500 uppercase mb-1">Telefone</label><input type="tel" required placeholder="(00) 00000-0000" value={shippingAddress.telefone} onChange={(e) => setShippingAddress({...shippingAddress, telefone: e.target.value})} className="w-full border rounded-xl px-3 py-2 text-sm" /></div>
                                        </div>
                                        <div className="grid grid-cols-4 gap-3">
                                            <div className="col-span-3"><label className="block text-xs font-bold text-stone-500 uppercase mb-1">Rua / Logradouro</label><input type="text" required value={shippingAddress.rua} onChange={(e) => setShippingAddress({...shippingAddress, rua: e.target.value})} className="w-full border rounded-xl px-3 py-2 text-sm" /></div>
                                            <div><label className="block text-xs font-bold text-stone-500 uppercase mb-1">Nº</label><input type="text" required value={shippingAddress.numero} onChange={(e) => setShippingAddress({...shippingAddress, numero: e.target.value})} className="w-full border rounded-xl px-3 py-2 text-sm" /></div>
                                        </div>
                                        <button type="submit" className="w-full bg-stone-900 hover:bg-stone-800 text-white font-bold py-3 rounded-xl text-sm transition-all shadow-md">Confirmar e Finalizar</button>
                                    </form>
                                )}

                                {checkoutStep === 'processing' && (
                                    <div className="text-center py-12 space-y-4">
                                        <div className="w-12 h-12 border-4 border-amber-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
                                        <p className="text-stone-600 font-medium">Processando seu pedido gourmet...</p>
                                    </div>
                                )}

                                {checkoutStep === 'success' && (
                                    <div className="text-center py-8 space-y-4">
                                        <div className="w-16 h-16 bg-emerald-100 text-emerald-600 border border-emerald-200 rounded-full flex items-center justify-center mx-auto text-2xl font-bold">✓</div>
                                        <h3 className="text-xl font-bold text-stone-900">Pedido Simulado com Sucesso!</h3>
                                        <p className="text-stone-500 text-sm">Obrigado por simular na <strong>Beer Bear</strong>. Seu site está 100% pronto e livre de erros de compilação.</p>
                                        <button onClick={() => setCheckoutStep('idle')} className="bg-stone-950 text-white font-bold px-6 py-2.5 rounded-xl text-sm hover:bg-stone-800">Voltar ao Site</button>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* Footer */}
                    <footer className="bg-stone-900 text-stone-500 text-xs py-10 border-t border-stone-800 text-center space-y-2">
                        <p className="font-serif tracking-widest text-amber-500/80 uppercase font-black text-sm">BEER BEAR GOURMET</p>
                        <p>&copy; 2026 Beer Bear Cervejaria. Desenvolvido para Alta Performance pública.</p>
                        <p class="text-stone-600 italic">Beba com responsabilidade. Proibido para menores de 18 anos.</p>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
